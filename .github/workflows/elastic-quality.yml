name: Elastic Adaptive Quality

on:
  pull_request:
    paths:
      - "crates/extrem_app/**"
      - "crates/extrem_engine/**"
      - "docs/ELASTIC_ADAPTIVE_QUALITY.md"
      - "Cargo.lock"
      - ".github/workflows/elastic-quality.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "crates/extrem_app/**"
      - "crates/extrem_engine/**"
      - "docs/ELASTIC_ADAPTIVE_QUALITY.md"
      - "Cargo.lock"
      - ".github/workflows/elastic-quality.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: Elastic facade consumer contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.89"
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Elastic consumer check
        run: cargo check -p extrem_engine --features elastic-quality --all-targets --locked
      - name: Elastic consumer clippy
        run: cargo clippy -p extrem_engine --features elastic-quality --all-targets --locked -- -D warnings
      - name: Elastic consumer tests
        run: cargo test -p extrem_engine --features elastic-quality --all-targets --locked
