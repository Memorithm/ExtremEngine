name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a543b44c1d5f964ecb95d4e32884c93f2f839ee4 # stable
      - uses: EmbarkStudios/cargo-deny-action@83712f5509714e8a15998b671a5472eb8b80e462 # v2.0.10
      - name: Formatting Check
        run: cargo fmt --all -- --check
      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentation Check
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  test:
    name: Test Suite Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a543b44c1d5f964ecb95d4e32884c93f2f839ee4 # master/stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cargo Check
        run: cargo check --workspace --all-targets --locked
      - name: Cargo Test
        run: cargo test --workspace --all-targets --locked
