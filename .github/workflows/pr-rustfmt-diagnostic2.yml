name: PR rustfmt diagnostic 2

on:
  pull_request:
    branches: [agent/initial-engine]

permissions:
  contents: read

jobs:
  rustfmt-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Produce diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --all > rustfmt-stdout.txt 2> rustfmt-stderr.txt
          printf '%s\n' "$?" > rustfmt-status.txt
          git diff -- crates/extrem_gpu/src/mesh_renderer.rs > rustfmt.patch
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: extremengine-instancing-rustfmt2-${{ github.event.pull_request.head.sha }}
          path: |
            rustfmt.patch
            rustfmt-stdout.txt
            rustfmt-stderr.txt
            rustfmt-status.txt
          if-no-files-found: error
          retention-days: 1
