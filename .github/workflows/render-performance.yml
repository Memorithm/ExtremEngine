name: Render Extraction Performance

on:
  push:
    branches: ["agent/**", main]
    paths:
      - "crates/extrem_engine/**"
      - "crates/extrem_render/**"
      - "crates/extrem_ecs/**"
      - "crates/extrem_math/**"
      - "crates/extrem_scene/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/render-performance.yml"
  pull_request:
    paths:
      - "crates/extrem_engine/**"
      - "crates/extrem_render/**"
      - "crates/extrem_ecs/**"
      - "crates/extrem_math/**"
      - "crates/extrem_scene/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/render-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-extraction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extraction:
    name: Extraction parity and CPU evidence
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Engine tests
        run: cargo test -p extrem_engine --all-targets --locked
      - name: Engine doctests
        run: cargo test -p extrem_engine --doc --locked
      - name: Engine lints
        run: cargo clippy -p extrem_engine --all-targets --locked -- -D warnings
      - name: Execution environment
        shell: bash
        run: |
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            uname -a
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.ncpu
            sysctl -n hw.memsize
            printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nRUSTFLAGS=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${RUSTFLAGS-}"
          } | tee extraction-environment.txt
      - name: Paired release-mode extraction benchmark
        shell: bash
        run: |
          export EXTREM_BENCH_REVISION="$(git rev-parse HEAD)"
          cargo run --release -p extrem_engine --example extraction_bench --locked | tee extraction-benchmark.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extraction-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            extraction-environment.txt
            extraction-benchmark.csv
          if-no-files-found: error
          retention-days: 90
