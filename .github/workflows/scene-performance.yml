name: Scene Performance

on:
  push:
    branches: ["agent/**", main]
    paths:
      - "crates/extrem_scene/**"
      - "crates/extrem_engine/**"
      - "crates/extrem_ecs/**"
      - "crates/extrem_math/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/scene-performance.yml"
  pull_request:
    paths:
      - "crates/extrem_scene/**"
      - "crates/extrem_engine/**"
      - "crates/extrem_ecs/**"
      - "crates/extrem_math/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/scene-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scene-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hierarchy:
    name: Scene correctness and CPU evidence
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Scene tests
        run: cargo test -p extrem_scene --all-targets --locked
      - name: Engine propagation integration tests
        run: cargo test -p extrem_engine --test propagation_runtime --locked
      - name: Scene lints
        run: cargo clippy -p extrem_scene --all-targets --locked -- -D warnings
      - name: Record execution environment
        shell: bash
        run: |
          {
            git rev-parse HEAD
            rustc --version --verbose
            cargo --version
            uname -a
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.ncpu
            sysctl -n hw.memsize
            printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nRUSTFLAGS=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${RUSTFLAGS-}"
          } | tee scene-environment.txt
      - name: Paired release-mode CPU benchmark
        shell: bash
        run: |
          export EXTREM_BENCH_REVISION="$(git rev-parse HEAD)"
          cargo run --release -p extrem_scene --example hierarchy_bench --locked | tee scene-benchmark.csv
      - name: Paired transform propagation benchmark
        shell: bash
        run: |
          export EXTREM_BENCH_REVISION="$(git rev-parse HEAD)"
          cargo run --release -p extrem_scene --example propagation_bench --locked | tee propagation-benchmark.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scene-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scene-environment.txt
            scene-benchmark.csv
            propagation-benchmark.csv
          if-no-files-found: error
          retention-days: 90
