[package]
name = "extrem_web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser and WebGPU capability probing for ExtremEngine"

[dependencies]
wgpu = "30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Navigator", "Window", "Document", "Element", "HtmlCanvasElement", "Performance", "VisibilityState", "EventTarget", "WindowEventHandlers", "ResizeObserver", "DomRectReadOnly"] }

[lints]
workspace = true
